<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gráfico de Velas Japonesas - Bolsa de Valores de Caracas</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        h2 {
            text-align: center;
            color: #00ffcc;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            background: #2e2e2e;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
            font-size: 16px;
        }
        #chart {
            width: 100%;
            height: 500px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Bolsa de Valores de Caracas - Velas Japonesas</h2>
        <label for="companySelect">Selecciona una Empresa:</label>
        <select id="companySelect"></select>
        <div id="chart"></div>
    </div>

    <script>
        let chart, candlestickSeries;
        let globalData = [];

        function initChart() {
            const chartContainer = document.getElementById('chart');
            chart = LightweightCharts.createChart(chartContainer, {
                width: chartContainer.clientWidth,
                height: 500,
                layout: {
                    background: { type: 'solid', color: '#1e1e1e' },
                    textColor: '#d1d4dc',
                },
                grid: {
                    vertLines: { color: '#2b2b2b' },
                    horzLines: { color: '#2b2b2b' },
                },
                timeScale: {
                    timeVisible: true,
                },
            });

            candlestickSeries = chart.addCandlestickSeries({
                upColor: '#26a69a',
                downColor: '#ef5350',
                borderVisible: false,
                wickUpColor: '#26a69a',
                wickDownColor: '#ef5350',
            });

            window.addEventListener('resize', () => {
                chart.applyOptions({ width: chartContainer.clientWidth });
            });
        }

        fetch('datos_bvc_completo.json')
            .then(response => response.json())
            .then(data => {
                globalData = data;
                const select = document.getElementById('companySelect');
                
                data.forEach((item, index) => {
                    const option = document.createElement('option');
                    option.value = index;
                    option.textContent = `${item.empresa} (${item.simbolo || 'N/A'})`;
                    select.appendChild(option);
                });

                if (data.length > 0) {
                    loadCandleData(0);
                }

                select.addEventListener('change', (e) => {
                    loadCandleData(e.target.value);
                });
            });

        function loadCandleData(index) {
            const company = globalData[index];
            if (company && company.datos_semana) {
                // Ordenar los datos por fecha ascendente
                const sortedData = company.datos_semana.sort((a, b) => new Date(a.time) - new Date(b.time));
                candlestickSeries.setData(sortedData);
                chart.timeScale().fitContent();
            }
        }

        initChart();
    </script>
</body>
</html>
